name: dreamlog
description: AI-powered dream journal with pattern analysis.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.3
  go_router: ^13.2.5
  speech_to_text: ^7.3.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  image_picker: ^1.1.2
  pdf: ^3.10.8
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
