org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The release AOT compiler runs in a separate process alongside this Gradle
# daemon. On a 16 GB machine an 8 GB Gradle heap starved it and the snapshot
# generator died with "Out of memory", so the daemon is capped and workers are
# limited to keep memory available for it.
org.gradle.workers.max=2
org.gradle.parallel=false
